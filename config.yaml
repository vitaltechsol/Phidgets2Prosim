PhidgetsMultiInputInstances:
  - Serial: 668511
    HubPort: 0
    Channels: [8, 9, 10]
    ProsimDataRef: S_RUDDER_TRIM
    Mappings:
      "110": 2  #Right
      "011": 1  #Left
      "000": 0

  - Serial: 668511
    HubPort: 0
    Channels: [5, 7, 6]
    ProsimDataRef: S_AILERON_TRIM
    Mappings:
      "110": 1  #Left
      "011": 2  #Right
      "000": 0

  - Serial: 668511
    HubPort: 0
    Channels: [14, 15]
    ProsimDataRef: S_FIRE_OVHT_DET1
    Mappings:
      "10": 1  #A
      "01": 2  #B
      "11": 0

  - Serial: 668511
    HubPort: 1
    Channels: [4, 5]
    ProsimDataRef: S_FIRE_OVHT_DET2
    Mappings:
      "01": 1  #A
      "10": 2  #B
      "11": 0

  - Serial: 668511
    HubPort: 2
    Channels: [1, 2]
    ProsimDataRef: S_FIRE_FAULT_TEST
    Mappings:
      "01": 1  #Test INOP/FAULT
      "10": 2  #Test OVHT/Fire
      "00": 0


#+++++++++++++++++++++++++++++++++++++
PhidgetsBLDCMotorInstances:
  - Serial: 746062
    HubPort: 0
    Reversed: true
    Offset: 0
    RefTurnOn: system.gates.B_THROTTLE_SERVO_POWER_LEFT
    RefCurrentPos: system.analog.A_THROTTLE_LEFT
    RefTargetPos: system.gauge.G_THROTTLE_LEFT
    Acceleration: 0.2

    Options:    
      MaxVelocity: 0.20
      MinVelocity: 0.02
      VelocityBand: 250.0
      CurveGamma: 0.55
      DeadbandEnter: 2.0
      DeadbandExit: 4.0
      MaxVelStepPerTick: 0.008
      Kp: 0.0
      Ki: 0.0
      Kd: 0.0
      IOnBand: 8.0
      IntegralLimit: 0.3
      PositionFilterAlpha: 0.30
      TickMs: 20

  - Serial: 746062
    HubPort: 1
    Reversed: true
    Offset: 0
    RefTurnOn: system.gates.B_THROTTLE_SERVO_POWER_RIGHT
    RefCurrentPos: system.analog.A_THROTTLE_RIGHT
    RefTargetPos: system.gauge.G_THROTTLE_RIGHT
    Acceleration: 0.2
    
    Options:
      MaxVelocity: 0.20
      MinVelocity: 0.02
      VelocityBand: 250.0
      CurveGamma: 0.55
      DeadbandEnter: 2.0
      DeadbandExit: 4.0
      MaxVelStepPerTick: 0.008
      Kp: 0.0
      Ki: 0.0
      Kd: 0.0
      IOnBand: 8.0
      IntegralLimit: 0.3
      PositionFilterAlpha: 0.30
      TickMs: 20


#+++++++++++++++++++++++++++++++++++++
PhidgetsDCMotorInstances:
  - Serial: 746062
    HubPort: 3  #Trim Indicator
    Acceleration: 70
    Reversed: true
    CurrentLimit: 4.0
    
    VoltageInput:
      Serial: 742347
      HubPort: 2
      Channel: -1 # IsHubPortDevice = true (-1) false (0)
      MinChangeTriggerValue: 0.003
      InputPoints: [0.264, 0.4153, 0.5517, 0.7004, 0.7598] # from Phidgets: @0-.264, @5-.4178, @10-.5517, @15-.7004, @17-.7598
      OutputPoints: [0, 5, 10, 15, 17]
    Options:
      MaxVelocity: 0.30
      MinVelocity: 0.22
      VelocityBand: 0.45
      CurveGamma: 1.2
      DeadbandEnter: 0.02
      DeadbandExit: 0.04
      MaxVelStepPerTick: 0.04
      Kp: 0.026
      Ki: 0
      Kd: 0.0045
      IOnBand: 0.04
      IntegralLimit: 0.012
      PositionFilterAlpha: 0.40
      TickMs: 15
      SetpointSlewPerTick: 0.04


